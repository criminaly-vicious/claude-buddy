[package]
name = "claude-buddy"
description = "Animated desktop buddies for your Claude Code sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "claude_buddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# preserve_order keeps the user's key order when the hook installer rewrites settings.json.
serde_json = { version = "1", features = ["preserve_order"] }
bridge-protocol = { path = "../../../crates/bridge-protocol" }
tiny_http = "0.12"
getrandom = "0.3"
notify = "8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

