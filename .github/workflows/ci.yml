name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, test, build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @claude-buddy/desktop build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  installer:
    uses: ./.github/workflows/bundle.yml

  mod:
    name: claude code mod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Mods are early access: pin the CLI the mod is written and tested against.
      - run: npm install -g @anthropic-ai/claude-code@2.1.323

      # The marketplace file, the manifest and the hooks module (types included).
      - run: claude plugin validate .
      - run: claude plugin validate mods/buddy-bridge
      # Unit and engine tests, including the target cases shared with Rust.
      - run: claude plugin test mods/buddy-bridge
