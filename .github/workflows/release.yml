name: release

# A `vX.Y.Z` tag on `main` builds the installer and opens a draft GitHub
# Release with that version's CHANGELOG.md section. The owner reviews and
# publishes it. Steps: CONTRIBUTING.md#releases-and-changelog.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  verify:
    name: check tag and notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag is on main and matches the app version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is not on main. Tag the merge commit of the release branch."
            exit 1
          fi
          app=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          crate=$(awk '/^\[workspace.package\]/{s=1;next} /^\[/{s=0} s && /^version *=/{gsub(/[" ]/,"",$0); sub(/version=/,""); print; exit}' Cargo.toml)
          if [ "$app" != "$version" ] || [ "$crate" != "$version" ]; then
            echo "::error::$TAG does not match the version in tauri.conf.json ($app) and Cargo.toml ($crate)."
            exit 1
          fi

      - name: Extract the release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v head="## [$version]" '
            index($0, head) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section."
            exit 1
          fi
          cat notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes.md

  installer:
    needs: verify
    uses: ./.github/workflows/bundle.yml

  draft:
    name: draft release
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/installer/*-setup.exe \
            --draft --verify-tag \
            --title "Claude Buddy ${TAG#v}" \
            --notes-file dist/notes/notes.md
