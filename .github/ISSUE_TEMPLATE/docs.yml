name: Documentation
description: Add, fix or improve documentation
title: "docs: "
labels: ["type:docs"]
body:
  - type: input
    id: location
    attributes:
      label: Page or file
      placeholder: README.md, docs/..., .context/...
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What needs to change?
    validations:
      required: true
